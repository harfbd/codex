<script>
const pages = [["封面", "我用 Codex 做了什麼", "一位教師的四個工作現場", "從一張考卷、一份研究、一批郵件，到一張要放進投影片的教材圖。我把平常手上的工作交給 Codex 協作，也在每一個關鍵處拿回來確認。", "個人體驗誌 ／ 01"], ["編者的話", "我從手邊的工作開始", "這四個案例都從一件本來就需要完成的事出發。", "我先說清楚誰會用、在哪裡用，以及交付時要看見什麼。做到一半，我會拿實際材料檢查，有時也會改口，把原本含糊的要求說得更具體。", "這本雜誌依既有對話重寫。頁內小示範以簡化內容重現操作。"], ["目錄", "四個工作現場", "選一個案例開始，也可以照順序翻閱。", "每個案例各四頁，從原始需求、修改過程，走到我怎麼確認成果。", ""], ["數學教材", "把考卷變成自學網頁", "我想讓孩子遇到卡住的題目時，可以自己聽、自己看，再做下一步。", "我提供三年級數學題目，請 Codex 轉成互動 HTML。22 道題目有了分步講解，也加入單獨朗讀與答案大字顯示。", "01 ／ 從紙本題目出發"], ["數學教材", "一題可以慢慢讀", "我把解題拆成孩子可以自行操作的步驟。", "從找線索、想方法、分步做，到會檢查、寫答案。孩子可以跳到需要的步驟，也能配合朗讀查看同步變色的文字。", "02 ／ 五步解題"], ["數學教材", "放大後，文字排成了一列", "有了大字還不夠。我看見容量單元在朗讀時，一個字排成一行。", "追查後發現，朗讀標記把文字拆成逐字元素，原本的格狀版面把它們當成一格一格來排。改成橫向文字容器之後，逐字高亮和正常閱讀都能保留。", "03 ／ 用實際操作找出問題"], ["數學教材", "把算式變成看得見的量", "容量換算可以先看見幾個完整公升，再看剩下多少毫升。", "我用這一題看教材怎麼同時呈現量感和算式。當時也檢查了 8000 毫升邊界值與 200% 字體放大。", "04 ／ 互動示範"], ["植栽研究", "同一份研究，面對不同讀者", "我需要把智慧植栽 RAG 專題寫進摘要、放進簡報，也讓路過海報的人看得懂。", "摘要要交代資料與方法，簡報要跟得上口頭說明，A1 海報則要讓讀者先從圖與圖說讀懂問題。Codex 協助我依不同媒介重新安排內容。", "01 ／ 從研究到發表"], ["植栽研究", "把資料規模說準確", "我回頭確認提供的材料、實際索引的手冊，以及切分後的區塊。", "共提供 8 份材料，實際索引 5 本中文栽培手冊，形成 277 個資料區塊。這些數字說明知識庫的規模。系統取回相關文字，再據此生成回答。", "02 ／ 8 份材料、5 本手冊、277 個區塊"], ["植栽研究", "把完成與示範分開寫", "手機畫面可以讓讀者更快理解系統，也容易讓人以為畫面裡的功能都經過驗證。", "我把已實作的文字檢索問答寫清楚，並在影像判讀和環境趨勢畫面加上示範標示。回答能追溯到資料來源，後續仍須用適切方法評估回答品質。", "03 ／ 讓圖說交代證據範圍"], ["植栽研究", "海報讓畫面先說話", "我希望讀者先看見操作流程，再讀方法和研究界線。", "結果區改用首頁、RAG 回答、查詢紀錄與環境介面四個手機畫面，配短圖說。最後依最新版 PDF 的位置替換高解析素材，另存 A1 版本。", "04 ／ 從畫面到輸出"], ["郵件整理", "先把篩選條件講清楚", "我的收件匣裡累積了學生來信，也留有大量同一種主旨的通知。", "我把工作拆成兩批。第一批用學校郵件網域和時間範圍篩選，第二批查找含指定文字的主旨。兩批都要求留下清冊。", "01 ／ 先定條件，再處理"], ["郵件整理", "兩批郵件，兩份清冊", "學生來信共 1,068 封，符合指定主旨的郵件共 2,582 封。", "兩批郵件移入垃圾桶後，各自留下一份 Excel。學生來信清冊包含寄件者、主旨與日期，主旨批次則記下寄件者姓名、地址和完整主旨。", "02 ／ 郵件可從垃圾桶找回"], ["郵件整理", "我用清冊看這次動了哪些信", "只看總數，我很難判斷這批資料是否符合原先說的範圍。", "把兩批分開記錄，我可以回頭對照每封信為何被納入，也能從清冊定位需要找回的郵件。", "03 ／ 批次作業留得下明細"], ["郵件整理", "如果先用四封範例信練習", "選一個條件，看看哪幾封會被納入。", "實際的郵件整理涉及私人資料，這裡用虛構郵件呈現兩種篩選方式，方便讀者對照。", "04 ／ 虛構資料，僅供示範"], ["教材去背", "「去背」要先說清楚去到哪裡", "一張齒輪圖裡有外圍格線，也有照片自己的淺綠底。這兩層背景可以分開處理。", "我試過只去外圈，以及連照片底色一起去除的版本。保留文字、箭頭與標註框，是我每一版都要檢查的條件。", "01 ／ 把範圍指出來"], ["教材去背", "同一張圖，可以有不同交付", "有些圖要放進投影片，有些圖要保留原卡片的樣子。", "齒輪和撓性傳動圖做成 16:9。清潔用具卡片則維持原尺寸與圓角框。各版另外輸出透明 PNG，方便回頭選擇合適的版本。", "02 ／ 用途決定比例"], ["教材去背", "我會看文字、細線和邊緣", "縮圖看起來乾淨，放大以後才看得見白邊、鋸齒和變色。", "去背時，我會對照原圖檢查箭頭、標籤和照片細節。部分細線或透明邊緣需要再修，這也讓我學會把驗收條件寫進一開始的要求。", "03 ／ 用原圖逐項比對"], ["教材去背", "試著選擇去背範圍", "用這張示意圖比較原圖、只去外圍，以及連照片底色一起去除。", "三種狀態保留同一個圖形與標籤。切換後可以看出，『去背』真正要交代的是哪一層、哪些物件要留。", "04 ／ 互動示範"], ["後記", "我把決定留在自己手上", "這四件事讓我重新想了一次，怎麼把一件工作交代到可以一起做。", "我會先交付原始材料和用途，再說清楚哪些地方可以改、哪些地方要保留。做到最後，我用孩子會不會操作、研究用語準不準、清冊對不對、圖片放大清不清楚來確認成果。", "一位教師的 Codex 個人體驗誌"]];
const sections = [[1,"封面"],[2,"編者的話"],[4,"三年級數學無障礙自學"],[8,"TANet 智慧植栽研究"],[12,"Gmail 郵件整理"],[16,"教材圖像去背"],[20,"後記"]];
const palettes = {"數學教材":["#236458","#deebe1"],"植栽研究":["#4b602c","#e7ecd6"],"郵件整理":["#315680","#e0e8f1"],"教材去背":["#884365","#f0e1e8"]};
const captions = {
1:["四個工作現場","教材 ／ 研究 ／ 行政 ／ 圖像"],

function panel(n, group) {

function installDemo(n) {
 if (n === 7) {
  const input = document.getElementById("volume");
  const update = () => {
   const ml = Number(input.value);
   const litres = Math.floor(ml / 1000);
   const remainder = ml % 1000;
   document.getElementById("equation").textContent = `${ml} = ${litres} × 1000 + ${remainder}`;
   input.setAttribute("aria-valuetext", `${litres} 公升 ${remainder} 毫升`);
   document.getElementById("vessels").innerHTML = '<span class="litre">1 L</span>'.repeat(litres) + (remainder ? `<span class="partial">${remainder} mL</span>` : "");
  };
  input.addEventListener("input",update);
  update();
 }
 if (n === 15) {

   const col = key === "school" ? 3 : 4;
   document.getElementById("result").textContent = `符合 ${sample.filter(row => row[col]).length} 封（示範）`;
   document.getElementById("sampleMail").innerHTML = sample.map(row => `<tr class="${row[col]?"matched":""}"><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}${row[col]?" ✓":""}</td></tr>`).join("");
   group.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed",button.dataset.filter === key));
  };
  group.addEventListener("click",e => {if(e.target.dataset.filter) update(e.target.dataset.filter)});
  update("school");
 }
 if (n === 19) {
  const group = document.getElementById("masks");
  const update = mode => {
   const label = ["原圖保留兩層背景","外圍已透明，保留照片綠底","外圍及照片底均透明"][mode];
   document.getElementById("maskPreview").innerHTML = `<svg viewBox="0 0 292 178" role="img" aria-label="${label}"><defs><pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fafafa"/><path d="M0 0h8v8H0zm8 8h8v8H8z" fill="#dedbdc"/></pattern><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff2cb"/><path d="M12 0H0v12" fill="none" stroke="#d5b877"/></pattern></defs><rect width="292" height="178" fill="url(#${mode===0?"grid":"checker"})"/><rect x="26" y="23" width="240" height="131" rx="8" fill="${mode<2?"#bad3ac":"none"}" stroke="#3b5840" stroke-width="2"/><circle cx="101" cy="87" r="36" fill="#4b5667" stroke="#28303a" stroke-width="9" stroke-dasharray="7 5"/><circle cx="101" cy="87" r="12" fill="#fffaf0"/><path d="M136 87h42" stroke="#27362f" stroke-width="2"/><rect x="169" y="70" width="79" height="34" rx="4" fill="#fffaf0" stroke="#27362f"/><text x="208" y="92" text-anchor="middle" fill="#252a28" font-size="15">齒輪標註</text></svg><p class="tiny" aria-live="polite">${label}</p>`;
   group.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed",Number(button.dataset.mask) === mode));
  };
  group.addEventListener("click",e => {if(e.target.dataset.mask !== undefined) update(Number(e.target.dataset.mask))});
  update(0);
 }
}
function show(index, animate = true) {
 const old = current;
 current = Math.max(0,Math.min(index,pages.length-1));
 const n = current+1;
 const [group,title,deck,body,note] = pages[current];
 const [accent,tint] = palettes[group] || ["#a13d25","#f0e1cd"];
 document.documentElement.style.setProperty("--accent",accent);
 document.documentElement.style.setProperty("--tint",tint);
 page.className = n === 1 ? "page cover" : "page";
 page.dataset.direction = current < old ? "back" : "forward";
 page.innerHTML = `<div class="kicker"><span>${group}</span><span>個人應用 / 2026</span></div><div class="spread"><div class="copy"><h1 id="title" tabindex="-1">${title}</h1><p class="deck">${deck}</p><p>${body}</p></div><aside class="art">${panel(n,group)}</aside></div><div class="folio"><span>${note || "CODEX FIELD NOTES"}</span><span>${pad(n)} / 20</span></div>`;
 document.getElementById("count").textContent = `${pad(n)} / 20`;
 document.getElementById("progress").value = n;
 prev.disabled = n === 1;
 next.disabled = n === pages.length;
 installDemo(n);
 if (animate) {
  void page.offsetWidth;
  page.classList.add("turn");
  window.scrollTo(0,0);
  document.getElementById("title").focus({preventScroll:true});
 }
}
prev.addEventListener("click",() => show(current-1));
next.addEventListener("click",() => show(current+1));
document.getElementById("openContents").addEventListener("click",() => dialog.showModal());
document.addEventListener("click",e => {
 const target = e.target.closest("[data-page]");
 if (!target) return;
 if (dialog.open) dialog.close();
 show(Number(target.dataset.page)-1);
});
document.addEventListener("keydown",e => {
 if (dialog.open || e.altKey || e.ctrlKey || e.metaKey || e.target.matches("input,textarea,select")) return;
 if (e.key === "ArrowRight" && !next.disabled) {e.preventDefault();show(current+1)}
 if (e.key === "ArrowLeft" && !prev.disabled) {e.preventDefault();show(current-1)}
});
let touchStart = null;
page.addEventListener("touchstart",e => {
 if (e.touches.length !== 1 || e.target.closest("button,input")) {touchStart=null;return}
 touchStart = [e.touches[0].clientX,e.touches[0].clientY];
},{passive:true});
page.addEventListener("touchend",e => {
 if (!touchStart) return;
 const dx=e.changedTouches[0].clientX-touchStart[0];
 const dy=e.changedTouches[0].clientY-touchStart[1];
 touchStart=null;
 if(Math.abs(dx)>65 && Math.abs(dx)>1.4*Math.abs(dy)) {
  if(dx<0 && !next.disabled) show(current+1);
  if(dx>0 && !prev.disabled) show(current-1);
 }
},{passive:true});
page.addEventListener("touchcancel",() => {touchStart=null});
show(0,false);
</script>
</body>
