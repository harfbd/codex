[{"insert":"<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>發音查詢</title>\n</head>\n<body>\n  <!-- 輸入單字的欄位 -->\n  <input type=\"text\" id=\"wordInput\" placeholder=\"請輸入英文單字\" />\n\n  <!-- 發音查詢按鈕 -->\n  <button id=\"ttsButton\">發音查詢</button>\n\n  <script>\n    document.getElementById('ttsButton').addEventListener('click', function() {\n      var word = document.getElementById('wordInput').value.trim();\n      if (!word) {\n        alert(\"請先輸入英文單字\");\n        return;\n      }\n      \n      // 使用 VoiceRSS TTS API 的範例\n      // 請替換 'YOUR_API_KEY' 為您從 VoiceRSS 取得的 API 金鑰\n      var apiKey = 'YOUR_API_KEY';\n      var language = 'en-us';  // 語言代碼，可依需求調整\n      var apiUrl = '"},{"insert":"https://api.voicerss.org/';","attributes":{"link":"https://api.voicerss.org/';"}},{"insert":"\n\n      // 建立 API 請求 URL\n      var url = apiUrl + '?key=' + apiKey + '&hl=' + language + '&src=' + encodeURIComponent(word);\n\n      // 建立 Audio 物件並播放語音\n      var audio = new Audio(url);\n      audio.play().catch(function(error) {\n        console.error(\"播放語音失敗：\", error);\n        alert(\"語音播放失敗，請檢查網路連線或 API 設定\");\n      });\n    });\n  </script>\n</body>\n</html>\n\n"}]
